title: User VPN Login
id: 1924f000-bf34-4f13-a59b-27ab913946fc
status: Production
description: >
  Find all logs where the event provider is equal to Syslog-SonicWall and the event codes equals 237 User VPN Login.
author: tacticalbeard-dev
date: 2025/07/02
modified: 2026/10/20
references:
  - "https://support.huntress.io/hc/en-us/articles/30113222043155-Huntress-Managed-SIEM-Log-Search-Guide"
  - "https://support.huntress.io/hc/en-us/articles/35348612546067-Starter-Queries-Sonicwall-Firewall"
  - "https://www.sonicwall.com/techdocs/pdf/sonicos-6-5-1-log-events-reference-guide.pdf"
  - "https://www.sonicwall.com/support/technical-documentation/docs/nsm-system_events/Content/nsm-system-events.htm"
tags:
  - attack.t1078
  - attack.t1133
  - attack.initial_access
  - sonicwall
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "Syslog-SonicWall"
picker: >
  Any window works: Huntress reads the whole picker range, newest first, in 4-hour steps. Wide
  ranges take longer (29 days of a small source and 14 days of a very large one each took about
  7 to 9 minutes in testing). Results are complete only once the grid shows Done. Raw results
  load 100 rows at a time as you scroll; scroll until the grid shows Done before treating a
  short or empty result as complete.
placeholders: []
query: >
  from logs
  | WHERE
      event.provider=="Syslog-SonicWall"
  | WHERE
      event.code==237
  | KEEP
      host.ip,
      sonicwall.sn,
      event.code,
      source.ip,
      sonicwall.usr,
      sonicwall.sess,
      message
expected_result: >
  User VPN logins (237) for the day, when the Authentication Access category is sent to syslog.
outcomes:
  rows: >
    Each row is a user VPN login. Compare source IPs with the user's normal locations.
  empty: >
    No matching events in this window. Empty is not proof nothing happened: none of these codes
    appeared from any client across four test days, and SonicWall documents them under the
    Authentication Access log category, so check that category is sent to syslog.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Some rows can carry an @timestamp outside the picker window; the picker doesn't filter on
  @timestamp alone. sonicwall.sess doesn't exist under that name in Huntress, so that column
  stays blank. host.hostname is never populated for SonicWall; use sonicwall.sn (serial) or
  host.ip to identify the firewall.
analyst_notes: |
  237 = User VPN Login (Authentication Access)
  A login from an unexpected location can mean stolen credentials or an exposed VPN.
  SonicWall documents these under the Authentication Access log category; check it is sent to syslog.
