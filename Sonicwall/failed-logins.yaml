title: Failed Logins
id: 6565fe2c-fd48-4ec5-b335-09d9844e75d5
status: Production
description: >
  Find all logs where the event provider is equal to Syslog-SonicWall and the event codes equals 33 Unknown User Login Attempt or 759 User Already Logged-In.
author: tacticalbeard-dev
date: 2025/07/02
modified: 2026/10/20
references:
  - "https://support.huntress.io/hc/en-us/articles/30113222043155-Huntress-Managed-SIEM-Log-Search-Guide"
  - "https://support.huntress.io/hc/en-us/articles/35348612546067-Starter-Queries-Sonicwall-Firewall"
  - "https://www.sonicwall.com/techdocs/pdf/sonicos-6-5-1-log-events-reference-guide.pdf"
  - "https://www.sonicwall.com/support/technical-documentation/docs/nsm-system_events/Content/nsm-system-events.htm"
tags:
  - attack.t1110
  - attack.credential_access
  - sonicwall
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "Syslog-SonicWall"
picker: >
  Any window works; wider windows take longer. Results are complete only once the grid
  shows Done. Raw results load 100 rows at a time as you scroll; scroll until the grid
  shows Done before treating a short or empty result as complete.
placeholders: []
query: >
  from logs
  | WHERE
      event.provider=="Syslog-SonicWall"
  | WHERE
      event.code==33
      OR event.code==759
  | KEEP
      host.ip,
      sonicwall.sn,
      event.code,
      source.ip,
      sonicwall.usr,
      sonicwall.sess,
      message
expected_result: >
  Unknown-user login attempts (33) and already-logged-in rejections (759) for the day, when the
  Authentication Access category is sent to syslog.
outcomes:
  rows: >
    Each row is a failed login. Many attempts from one IP point to password guessing.
  empty: >
    No matching events in this window. Empty is not proof nothing happened: SonicWall documents
    these codes under the Authentication Access log category, so check that category is sent to
    syslog.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Some rows can carry an @timestamp outside the picker window; the picker doesn't filter on
  @timestamp alone. sonicwall.sess doesn't exist under that name in Huntress, so that column
  stays blank. host.hostname is never populated for SonicWall; use sonicwall.sn (serial) or
  host.ip to identify the firewall.
analyst_notes: |
  33 = Unknown User Login (Authentication Access)
  759 = User Already Logged-In (Authentication Access)
  SonicWall documents these under the Authentication Access log category; check it is sent to syslog.
