title: Local Logins Against Firewall
id: 227aaa3e-4c15-4fd5-8d4f-7621569babf2
status: Production
description: >
  Find all logs where the event provider is equal to Syslog-Fortigate and the event codes are failed, successful, or lockout.
author: tacticalbeard-dev
date: 2025/06/26
modified: 2026/10/20
references:
  - "https://support.huntress.io/hc/en-us/articles/30113222043155-Huntress-Managed-SIEM-Log-Search-Guide"
  - "https://support.huntress.io/hc/en-us/articles/35776541248275-Starter-Queries-FortiGate-Firewall"
tags:
  - attack.t1078
  - attack.t1110
  - attack.initial_access
  - attack.credential_access
  - fortigate
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "Syslog-Fortigate"
picker: >
  One UTC day: 20:00 to 19:59 Eastern during EDT, 19:00 to 18:59 during EST. A search reads only
  the last UTC day of the picker window, and a future end time returns nothing.
placeholders: []
query: >
  from logs
  | WHERE
      event.provider=="Syslog-Fortigate"
  | WHERE
      event.code==43008
      OR event.code==43009
      OR event.code==43010
  | KEEP
      fortigate.duser,
      fortigate.FTNTFGTprofile,
      fortigate.src,
      fortigate.dst,
      fortigate.FTNTFGTmethod,
      fortigate.FTNTFGTauthproto,
      event.code,
      fortigate.outcome,
      fortigate.reason
expected_result: >
  Rows only where the firewall authenticates users itself (firewall authentication policies);
  none were seen across two test days.
outcomes:
  rows: >
    Each row is a local authentication success (43008), failure (43009) or lockout (43010).
  empty: >
    No local authentication events on this UTC day. These only occur when the FortiGate
    authenticates users itself, so empty is normal for most firewalls.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Covers one UTC day per search; run it once per day for a longer period.
  fortigate.FTNTFGTauthproto was empty in testing.
analyst_notes: >
  These event codes show any local login attempts against the firewall.
  Event code 43008 - Authentication Success
  Event code 43009 - Authentication Failure
  Event code 43010 - Authentication Lockout
