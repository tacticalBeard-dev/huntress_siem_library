title: FortiGate SSL-VPN Authentication Failure Spike
id: 902a2007-4abc-4754-91fd-8e336743693d
status: Production
description: >
  Detects a high volume of SSL-VPN authentication failures from a single source IP
  against a FortiGate firewall. FortiGate SSL-VPN endpoints have been high-value targets
  for credential stuffing and brute-force attacks. A burst of failures from a single IP
  followed by a success is the pattern most consistent with a successful credential-based
  compromise. Event code 39426 represents an SSL-VPN login failure.
author: tacticalbeard-dev
date: 2026/05/02
modified: 2026/10/20
references:
  - "https://attack.mitre.org/techniques/T1110/"
  - "https://www.cisa.gov/known-exploited-vulnerabilities-catalog"
  - "https://support.huntress.io/hc/en-us/articles/35776541248275-Starter-Queries-FortiGate-Firewall"
tags:
  - attack.t1110
  - attack.t1133
  - attack.credential_access
  - attack.initial_access
  - fortigate
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "Syslog-Fortigate"
picker: >
  Any window works: Huntress reads the whole picker range, newest first, in 4-hour steps. Wide
  ranges take longer (29 days of a small source and 14 days of a very large one each took about
  7 to 9 minutes in testing). Results are complete only once the grid shows Done.
placeholders: []
query: >
  from logs
  | WHERE
      event.provider=="Syslog-Fortigate"
  | WHERE
      event.code==39426
  | STATS
      failure_count = COUNT(*)
      BY source.ip
  | WHERE
      failure_count >= 10
  | SORT
      failure_count DESC
expected_result: >
  Where SSL-VPN faces the internet, hundreds of source IPs with ten or more failures a day (333
  on the test day).
outcomes:
  rows: >
    Each row is a source IP with failure_count SSL-VPN failures, highest first. Check the top
    IPs for any successful tunnel (39424 or 39947) from the same IP.
  empty: >
    No source IP reached ten failures in this window.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Some rows can carry an @timestamp outside the picker window; the picker doesn't filter on
  @timestamp alone. On SSL-VPN events the remote client IP is in source.ip (and fortigate.dst);
  fortigate.src is empty.
analyst_notes: >
  Event code 39426 is SSL-VPN login failure. Failures followed by a successful tunnel
  event (39424 or 39947) from the same source IP indicate a successful brute-force;
  prioritize those for immediate response. On SSL-VPN events the remote client IP is in
  source.ip (FortiGate also writes it to fortigate.dst); fortigate.src is empty. Cross-
  reference high-failure source IPs against threat intelligence feeds and check for
  corresponding successful SSL-VPN tunnel events using sslvpn-tunnel-info.yaml.
