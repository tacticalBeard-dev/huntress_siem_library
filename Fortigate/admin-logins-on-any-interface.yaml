title: Admin Logins on Any Interface
id: 8741b63c-a7d6-4ffe-b886-7499835068b8
status: Production
description: >
  Find all logs where the event provider is equal to Syslog-Fortigate and the event codes are failed or successfull admin logins.
author: tacticalbeard-dev
date: 2025/06/26
modified: 2026/10/20
references:
  - "https://support.huntress.io/hc/en-us/articles/30113222043155-Huntress-Managed-SIEM-Log-Search-Guide"
  - "https://support.huntress.io/hc/en-us/articles/35776541248275-Starter-Queries-FortiGate-Firewall"
tags:
  - attack.t1078
  - attack.t1110
  - attack.initial_access
  - attack.credential_access
  - fortigate
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "Syslog-Fortigate"
picker: >
  Any window works: Huntress reads the whole picker range, newest first, in 4-hour steps. Wide
  ranges take longer (29 days of a small source and 14 days of a very large one each took about
  7 to 9 minutes in testing). Results are complete only once the grid shows Done. Raw results
  load 100 rows at a time as you scroll; scroll until the grid shows Done before treating a
  short or empty result as complete.
placeholders: []
query: >
  from logs
  | WHERE
      event.provider=="Syslog-Fortigate"
  | WHERE
      event.code==32001
      OR event.code==32002
  | KEEP
      fortigate.duser,
      fortigate.FTNTFGTprofile,
      fortigate.src,
      fortigate.dst,
      fortigate.FTNTFGTmethod,
      event.code,
      fortigate.outcome,
      fortigate.reason
expected_result: >
  Admin login successes (32001) and failures (32002) for the day. Failures often run to
  thousands where a management interface faces the internet.
outcomes:
  rows: >
    Each row is an admin login attempt with user, profile, source and method (https or ssh).
    Large numbers of failures from public IPs mean the management interface is exposed.
  empty: >
    No admin logins in this window, which is possible on quiet firewalls.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Some rows can carry an @timestamp outside the picker window; the picker doesn't filter on
  @timestamp alone.
analyst_notes: |
  These event codes show admin login attempts for any interface.
  Event code 32002 is Admin Logon Failed and 32001 is Admin Logon Success.
  These events can give an indication of normal vs abnormal source and username attempts.
  Excessive failed login attempts should be investigated to determine intent and point of origin.
  The method (FTNTFGTmethod) used can also distinguish https vs ssh login types.
