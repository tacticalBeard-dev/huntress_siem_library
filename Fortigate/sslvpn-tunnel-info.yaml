title: SSLVPN Tunnel Info
id: b98cf048-afb1-426c-8970-075a91fc2dfd
status: Production
description: >
  Find all logs where the event provider is equal to Syslog-Fortigate and the event codes are informational SSLVPN tunnel events.
author: tacticalbeard-dev
date: 2025/06/26
modified: 2026/10/20
references:
  - "https://support.huntress.io/hc/en-us/articles/30113222043155-Huntress-Managed-SIEM-Log-Search-Guide"
  - "https://support.huntress.io/hc/en-us/articles/35776541248275-Starter-Queries-FortiGate-Firewall"
tags:
  - attack.t1133
  - attack.initial_access
  - fortigate
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "Syslog-Fortigate"
picker: >
  Any window works: Huntress reads the whole picker range, newest first, in 4-hour steps. Wide
  ranges take longer (29 days of a small source and 14 days of a very large one each took about
  7 to 9 minutes in testing). Results are complete only once the grid shows Done. Raw results
  load 100 rows at a time as you scroll; scroll until the grid shows Done before treating a
  short or empty result as complete.
placeholders: []
query: >
  from logs
  | WHERE
      event.provider=="Syslog-Fortigate"
  | WHERE
      event.code IN (39424, 39947, 39948)
  | KEEP
      host.hostname,
      event.code,
      event.name,
      fortigate.FTNTFGTtunnelid,
      fortigate.duser,
      fortigate.dst,
      fortigate.FTNTFGTtunnelip,
      fortigate.FTNTFGTduration,
      fortigate.out,
      fortigate.in
expected_result: >
  A few tunnel up and down events per day per firewall with remote users.
outcomes:
  rows: >
    Each row is an SSL-VPN tunnel event with user, tunnel IP, duration and bytes. Pair 39424 or
    39947 (up) with 39948 (down) by tunnel ID to see sessions.
  empty: >
    No SSL-VPN tunnels in this window.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Some rows can carry an @timestamp outside the picker window; the picker doesn't filter on
  @timestamp alone. The remote client IP for SSL-VPN tunnels is in fortigate.dst (kept by this
  query) and source.ip; fortigate.src is empty.
analyst_notes: |
  Event Code 39948 - SSL tunnel shutdown
  Event Code 39947 - SSL tunnel established (tunnel established)
  Event Code 39424 - SSL VPN user tunnel up (login successful)
