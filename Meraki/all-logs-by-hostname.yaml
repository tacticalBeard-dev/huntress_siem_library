title: All Logs by Hostname
id: 679752b9-44ac-47dd-a998-fb65c5cff2b7
status: Production
description: >
  Find all logs where the event provider is equal to Syslog-Meraki.
author: tacticalbeard-dev
date: 2025/06/24
modified: 2026/10/20
references:
  - "https://support.huntress.io/hc/en-us/articles/30113222043155-Huntress-Managed-SIEM-Log-Search-Guide"
  - "https://support.huntress.io/hc/en-us/articles/41181137671827-API-Cisco-Meraki-Cloud"
  - "https://support.huntress.io/hc/en-us/articles/38958950569107-Syslog-Cisco-Meraki-MX-Security-Appliance"
  - "https://documentation.meraki.com/General_Administration/Monitoring_and_Reporting/Syslog_Event_Types_and_Log_Samples"
tags:
  - meraki
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "Syslog-Meraki"
picker: >
  Any window works: Huntress reads the whole picker range, newest first, in 4-hour steps. Wide
  ranges take longer (29 days of a small source and 14 days of a very large one each took about
  7 to 9 minutes in testing). Results are complete only once the grid shows Done. Raw results
  load 100 rows at a time as you scroll; scroll until the grid shows Done before treating a
  short or empty result as complete.
placeholders: []
query: >
  from logs
  | WHERE
      event.provider=="Syslog-Meraki"
  | KEEP
      host.hostname,
      host.ip
expected_result: >
  Every Meraki MX syslog record for the day; content filtering blocks are usually most of it.
outcomes:
  rows: >
    Meraki syslog is reaching the SIEM. Open a row to see the meraki.* fields for building other
    queries.
  empty: >
    No Meraki syslog arrived for this window. Check the MX syslog server settings before
    treating anything as clean.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Some rows can carry an @timestamp outside the picker window; the picker doesn't filter on
  @timestamp alone. This covers Meraki MX syslog (Syslog-Meraki), not the separate Meraki cloud
  API integration.
analyst_notes: >
  This will give you a good starting point for finding the raw logs.
  You can use this information to verify logs are being ingested and retained.
  The raw logs will also assist with creating other queries.
