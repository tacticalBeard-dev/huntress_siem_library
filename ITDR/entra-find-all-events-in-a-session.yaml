title: ENTRA Find All Events in a Browser Session
id: null
status: Production
description: >
  Find every ITDR record that shares one browser session ID, across every account that used that session.
author: tacticalbeard-dev
date: 2025/06/24
modified: 2026/05/02
references:
  - "https://support.huntress.io/hc/en-us/categories/19906075516051-Huntress-Managed-Identity-Threat-Detection-and-Response-ITDR"
  - "https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes"
tags:
  - microsoft.entra.id
logsource:
  language: ESQL
  platform: Huntress SIEM
  type: ITDR
analyst_notes: >
  Replace <session id lowercase> with the session ID from a sign-in row (session.id, also shown as
  itdr.DeviceProperties.SessionId), in lowercase. The query lowercases session.id so casing in the
  source record doesn't matter. Results include every account that signed in through the same browser
  profile, which is how a shared or hijacked browser session shows up. Do not search the message
  field for this: it holds only a one-line summary and never contains user IDs, IPs or session IDs.
query: >
  from logs
  | WHERE
      event.provider=="ITDR"
      AND TO_LOWER(session.id)=="<session id lowercase>"
  | KEEP
      @timestamp,
      itdr.UserId,
      itdr.UserKey,
      itdr.Operation,
      itdr.ErrorNumber,
      source.ip,
      itdr.ExtendedProperties.Value
