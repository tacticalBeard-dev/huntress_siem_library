title: ENTRA App Credentials and Owners Added
id: 02341b39-a756-46db-ac99-124cd665de86
status: Production
description: >
  List secrets and certificates added to apps and service principals, and new app owners. A
  credential added to an existing app lets an attacker sign in as that app with its permissions.
author: tacticalbeard-dev
date: 2026/10/21
modified: 2026/10/21
references:
  - "https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-audit-activities"
  - "https://attack.mitre.org/techniques/T1098/001/"
  - "https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/manage-application-permissions"
tags:
  - attack.t1098.001
  - attack.persistence
  - microsoft.entra.id
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "ITDR"
picker: >
  Any window works; wider windows take longer. Results are complete only once the grid
  shows Done. Raw results load 100 rows at a time as you scroll; scroll until the grid
  shows Done before treating a short or empty result as complete.
placeholders: []
query: >
  from logs
  | WHERE
      event.provider=="ITDR"
      AND (
        itdr.Operation IN ("Add service principal credentials.", "Add owner to application.", "Add owner to service principal.")
        OR CONTAINS(itdr.Operation, "Certificates and secrets management")
      )
  | KEEP
      @timestamp,
      itdr.Operation,
      itdr.UserId,
      itdr.ObjectId,
      itdr.Target.ID,
      itdr.ModifiedProperties.Name,
      itdr.ModifiedProperties.NewValue
expected_result: >
  A handful of rows; credential and owner changes are infrequent.
outcomes:
  rows: >
    itdr.UserId is who made the change and itdr.Target.ID identifies the app. A credential added
    to a high-privilege app (one with Mail, Directory or Files permissions) by someone who isn't
    its normal owner is the priority. Check the app's sign-ins afterwards: app-only sign-ins
    carry the app ID in itdr.UserKey.
  empty: >
    No app credentials or owners were added in this window, which is common.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Some rows can carry an @timestamp outside the picker window; the picker doesn't filter on
  @timestamp alone. The certificates and secrets operation names contain a dash character, so
  they're matched with CONTAINS. Credential rotation by automation shows up here too.
analyst_notes: >
  If the change isn't expected, delete the new credential, review the app's permissions, and
  check what it accessed since the change.
