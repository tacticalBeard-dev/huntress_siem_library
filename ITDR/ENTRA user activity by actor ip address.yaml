title: ENTRA User Activity by Actor IP Address
id: null
status: Production
description: >
  Summarize all ITDR activity from one IP address, checking every field an ITDR record can carry the IP in.
author: tacticalbeard-dev
date: 2025/06/24
modified: 2026/05/02
references:
  - "https://support.huntress.io/hc/en-us/categories/19906075516051-Huntress-Managed-Identity-Threat-Detection-and-Response-ITDR"
tags:
  - attack.t1078.004
  - attack.initial_access
  - microsoft.entra.id
logsource:
  language: ESQL
  platform: Huntress SIEM
  type: ITDR
analyst_notes: >
  Replace <ip> with the address to look up (IPv4 or IPv6). Sign-in records carry the IP in
  itdr.ClientIP, itdr.ActorIpAddress and source.ip; other workloads may carry it in only one of them,
  so the query checks all three. Each row is one account and operation from that IP with its count.
  Any UserLoggedIn row from a known-bad IP is the priority row. Useful for verifying trusted IPs or
  sweeping an IOC.
query: >
  from logs
  | WHERE
      event.provider=="ITDR"
      AND (source.ip=="<ip>" OR itdr.ClientIP=="<ip>" OR itdr.ActorIpAddress=="<ip>")
  | STATS
      events = COUNT(*)
      BY itdr.ClientIP, itdr.Operation, itdr.UserId
  | SORT
      events DESC
