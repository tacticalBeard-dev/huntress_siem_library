title: ENTRA MFA Enabled
id: b3330a28-2b3b-4de8-a066-bdcb2e5f0855
status: Production
description: >
  Find all logs where the event provider is equal to ITDR and the operation is Enable Strong Authentication.
author: tacticalbeard-dev
date: 2025/06/24
modified: 2026/10/20
references:
  - "https://support.huntress.io/hc/en-us/categories/19906075516051-Huntress-Managed-Identity-Threat-Detection-and-Response-ITDR"
tags:
  - attack.t1556.006
  - microsoft.entra.id
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "ITDR"
picker: >
  Any window works; wider windows take longer. Results are complete only once the grid
  shows Done. Raw results load 100 rows at a time as you scroll; scroll until the grid
  shows Done before treating a short or empty result as complete.
placeholders: []
query: >
  from logs
  | WHERE
      event.provider=="ITDR"
      AND itdr.Operation=="Enable Strong Authentication."
  | KEEP
      itdr.Operation,
      itdr.UserId,
      itdr.UserType,
      itdr.ObjectId
expected_result: >
  A handful of rows on a normal day, mostly during onboarding.
outcomes:
  rows: >
    Each row is a per-user MFA enable. itdr.ObjectId is the account it was enabled on.
  empty: >
    No per-user MFA was enabled in this window, which is normal outside onboarding periods.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Some rows can carry an @timestamp outside the picker window; the picker doesn't filter on
  @timestamp alone. The match is exact, including the trailing period in "Enable Strong
  Authentication.".
analyst_notes: >
  This will identify when strong authentication has been enabled.
  Even though this would be considered a desirable action, if it occurs outside of traditional onboarding periods or activation campaigns it could highlight a process issue.
