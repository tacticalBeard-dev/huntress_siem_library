title: ENTRA User Login Blocked by Conditional Access
id: b1f8488e-0a4c-438d-bf58-9602f7b25a04
status: Production
description: >
  Find all logs where the event provider is equal to ITDR and the logon error is Blocked By Conditional Access.
author: tacticalbeard-dev
date: 2025/06/24
modified: 2026/10/20
references:
  - "https://support.huntress.io/hc/en-us/categories/19906075516051-Huntress-Managed-Identity-Threat-Detection-and-Response-ITDR"
  - "https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes"
tags:
  - attack.t1078.004
  - attack.t1110
  - attack.credential_access
  - attack.initial_access
  - microsoft.entra.id
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "ITDR"
picker: >
  Any window works: Huntress reads the whole picker range, newest first, in 4-hour steps. Wide
  ranges take longer (29 days of a small source and 14 days of a very large one each took about
  7 to 9 minutes in testing). Results are complete only once the grid shows Done. Raw results
  load 100 rows at a time as you scroll; scroll until the grid shows Done before treating a
  short or empty result as complete.
placeholders: []
query: >
  from logs
  | WHERE
      event.provider=="ITDR"
  | WHERE
      itdr.LogonError=="BlockedByConditionalAccess"
  | KEEP
      itdr.Operation,
      itdr.UserKey,
      itdr.UserId,
      itdr.ClientIP,
      itdr.DeviceProperties.OS,
      itdr.DeviceProperties.BrowserType,
      itdr.DeviceProperties.IsCompliant,
      itdr.LogonError
expected_result: >
  A few dozen rows on a normal day across a set of tenants (24 on the test day).
outcomes:
  rows: >
    Each row is a sign-in Conditional Access blocked. Compare the IP and device fields against
    the user's normal sign-ins, then check which policy fired in Entra.
  empty: >
    No sign-ins were blocked by Conditional Access in this window.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Some rows can carry an @timestamp outside the picker window; the picker doesn't filter on
  @timestamp alone. Device fields (itdr.DeviceProperties.*) are only populated on sign-in
  records, so they can be blank on other rows. The audit log records the block as an error only;
  the policy name is in the Entra sign-in log, not here.
analyst_notes: >
  It is important to know the reason and CA policy conditions that triggered this error.
  The client IP and device properties are also useful when compared to baseline events.
