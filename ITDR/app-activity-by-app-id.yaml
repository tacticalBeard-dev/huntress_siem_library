title: App Activity by App ID
id: f8d3009d-c488-478b-8378-75814fae4043
status: Production
description: >
  Find activity performed by one app identity (backup tools, MDR apps, management platforms)
  using its application ID.
author: tacticalbeard-dev
date: 2026/10/21
modified: 2026/10/21
references:
  - "https://support.huntress.io/hc/en-us/categories/19906075516051-Huntress-Managed-Identity-Threat-Detection-and-Response-ITDR"
  - "https://learn.microsoft.com/en-us/purview/audit-log-activities"
tags:
  - attack.t1078.004
  - microsoft.entra.id
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "ITDR"
picker: >
  Any window works; wider windows take longer. Results are complete only once the grid
  shows Done.
placeholders:
  - "<app-guid>: the application (client) ID, lowercase, for example a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"
query: >
  from logs
  | WHERE
      event.provider=="ITDR"
      AND (
        itdr.UserKey=="<app-guid>"
        OR itdr.ApplicationId=="<app-guid>"
      )
  | STATS
      events = COUNT(*),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
      BY itdr.UserId, itdr.Operation
  | SORT
      events DESC
expected_result: >
  One row per identity name and operation the app performed or was used for.
outcomes:
  rows: >
    On app-only records itdr.UserKey is the app ID and itdr.UserId is its display name. On sign-
    ins through the app, itdr.ApplicationId is the app and itdr.UserId is the user. Check that
    the operations match what the app is for.
  empty: >
    The app did no logged work in this window. That doesn't mean it isn't consented; check
    Enterprise applications in Entra ID.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Some rows can carry an @timestamp outside the picker window; the picker doesn't filter on
  @timestamp alone. Service principal sign-ins aren't in ITDR. Directory changes made by an app
  show itdr.UserId as ServicePrincipal_<object id>, not the app ID, so they may not match.
analyst_notes: >
  itdr.AppAccessContext.ClientAppId carries the same ID on many workload records if you need a
  third place to look.
