title: ENTRA User Login Invalid Username or Password
id: f547b6b2-0310-4a7c-95fe-aa89e9628308
status: Production
description: >
  Find all logs where the event provider is equal to ITDR and the logon error is Invalid Username or Password.
author: tacticalbeard-dev
date: 2025/06/24
modified: 2026/10/20
references:
  - "https://support.huntress.io/hc/en-us/categories/19906075516051-Huntress-Managed-Identity-Threat-Detection-and-Response-ITDR"
  - "https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes"
tags:
  - attack.t1110
  - attack.t1110.003
  - attack.credential_access
  - microsoft.entra.id
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "ITDR"
picker: >
  One UTC day: 20:00 to 19:59 Eastern during EDT, 19:00 to 18:59 during EST. A search reads only
  the last UTC day of the picker window, and a future end time returns nothing.
placeholders: []
query: >
  from logs
  | WHERE
      event.provider=="ITDR"
  | WHERE
      itdr.LogonError=="InvalidUserNameOrPassword"
  | KEEP
      itdr.Operation,
      itdr.UserKey,
      itdr.UserId,
      itdr.ClientIP,
      itdr.DeviceProperties.OS,
      itdr.DeviceProperties.BrowserType,
      itdr.DeviceProperties.IsCompliant,
      itdr.LogonError
expected_result: >
  Rows on any normal day (several hundred across tenants on the test day).
outcomes:
  rows: >
    Each row is a wrong username or password. Many accounts failing from one IP points to
    password spraying.
  empty: >
    No wrong-password failures on this UTC day, which is unusual; check the picker first.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Covers one UTC day per search; run it once per day for a longer period. Device fields
  (itdr.DeviceProperties.*) are only populated on sign-in records, so they can be blank on other
  rows.
analyst_notes: >
  The user is required to provide valid credentials before CA policies are applied so this error would proceed any other conditional blocks.
  This error is more specific than the generic User Login Failed operation.
