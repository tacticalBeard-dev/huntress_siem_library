title: ENTRA Password Spray by IP
id: d372091a-6162-48af-bc24-184e1cc5f07c
status: Production
description: >
  Rank source IPs by how many different accounts they failed to sign in to with a wrong
  password. One IP failing against many accounts is a password spray.
author: tacticalbeard-dev
date: 2026/10/21
modified: 2026/10/21
references:
  - "https://learn.microsoft.com/en-us/security/operations/incident-response-playbook-password-spray"
  - "https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes"
  - "https://attack.mitre.org/techniques/T1110/003/"
tags:
  - attack.t1110.003
  - attack.credential_access
  - microsoft.entra.id
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "ITDR"
picker: >
  Any window works; wider windows take longer. Results are complete only once the grid
  shows Done.
placeholders: []
query: >
  from logs
  | WHERE
      event.provider=="ITDR"
      AND itdr.LogonError=="InvalidUserNameOrPassword"
  | STATS
      accounts = count_distinct(itdr.UserId),
      failures = COUNT(*),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
      BY itdr.ClientIP
  | SORT
      accounts DESC
expected_result: >
  One row per source IP, most accounts first. Most IPs show one account (a user mistyping their
  password).
outcomes:
  rows: >
    An IP with failures against many accounts is the spray. Look up the IP (hosting providers
    and VPN services are common sources), then run entra-user-activity-by-actor-ip-address.yaml
    on it to see whether any sign-in from it succeeded.
  empty: >
    No wrong-password failures in this window.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Some rows can carry an @timestamp outside the picker window; the picker doesn't filter on
  @timestamp alone. The grid shows at most 1,000 rows. The list is sorted, so the top of it is
  complete. Sprays spread across many IPs at low volume won't stand out per IP. Failures against
  accounts that don't exist aren't counted here. count_distinct is reliable on user and IP
  fields but returned partial results on fields with tens of thousands of distinct values, so
  don't reuse this pattern on a field like itdr.Id.
analyst_notes: >
  InvalidUserNameOrPassword is error 50126. If a sprayed account later signs in successfully
  from the same IP, treat it as compromised: reset the password, revoke sessions, and check for
  inbox rules and MFA changes.
