title: Exchange Transport Rule Changes
id: 44807ee3-3262-4fb7-b531-999cacb72e43
status: Production
description: >
  List Exchange mail flow (transport) rules created, changed or removed. A rule here affects
  every mailbox, so a malicious one can copy, redirect or delete mail for the whole tenant.
author: tacticalbeard-dev
date: 2026/10/21
modified: 2026/10/21
references:
  - "https://learn.microsoft.com/en-us/powershell/module/exchange/new-transportrule"
  - "https://learn.microsoft.com/en-us/purview/audit-log-activities"
  - "https://attack.mitre.org/techniques/T1114/003/"
tags:
  - attack.t1114.003
  - attack.t1564.008
  - attack.collection
  - attack.defense_evasion
  - microsoft.entra.id
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "ITDR"
picker: >
  Any window works; wider windows take longer. Results are complete only once the grid
  shows Done. Raw results load 100 rows at a time as you scroll; scroll until the grid
  shows Done before treating a short or empty result as complete.
placeholders: []
query: >
  from logs
  | WHERE
      event.provider=="ITDR"
      AND itdr.Operation IN ("New-TransportRule", "Set-TransportRule", "Remove-TransportRule", "Enable-TransportRule", "Disable-TransportRule")
  | KEEP
      @timestamp,
      itdr.Operation,
      itdr.UserId,
      itdr.ObjectId,
      itdr.ClientIP,
      itdr.Parameters.Name,
      itdr.Parameters.Value
expected_result: >
  A few rows, nearly all made by admins or security tools (for example rules that block or tag
  mail from a domain).
outcomes:
  rows: >
    itdr.ObjectId is the rule name, itdr.UserId is who changed it. Look for BlindCopyTo,
    RedirectMessageTo, AddToRecipients or DeleteMessage in itdr.Parameters.Name, rules made by
    an account that isn't an admin, and rules made outside change windows.
  empty: >
    No transport rules changed in this window, which is normal.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Some rows can carry an @timestamp outside the picker window; the picker doesn't filter on
  @timestamp alone. Changing a transport rule needs an Exchange admin role, so a malicious rule
  means an admin account or admin app is compromised.
analyst_notes: >
  Security tools and email filtering products often create transport rules automatically.
  Compare the actor against the tenant's known admin and service accounts.
