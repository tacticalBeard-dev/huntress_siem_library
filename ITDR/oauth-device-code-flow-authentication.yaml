title: OAuth Device Code Flow Authentication
id: 9fc0a04b-ef89-4bde-a515-b990082d4f02
status: Production
description: >
  Detects Microsoft 365 / Entra ID authentications using the OAuth 2.0 Device
  Authorization Grant (device code) flow. This flow is legitimate for input-constrained
  devices but is actively abused in device code phishing attacks where victims are tricked
  into entering an attacker-controlled code at microsoft.com/devicelogin. The attacker
  receives a valid refresh token that persists through password resets. In most corporate
  environments device code flow is rarely used legitimately and any occurrence should be
  reviewed.
author: tacticalbeard-dev
date: 2026/05/02
modified: 2026/10/20
references:
  - "https://attack.mitre.org/techniques/T1528/"
  - "https://www.proofpoint.com/us/blog/threat-insight/access-granted-phishing-device-code-authorization-account-takeover"
  - "https://learn.microsoft.com/en-us/entra/identity/conditional-access/policy-block-device-code-flow"
tags:
  - attack.t1528
  - attack.credential_access
  - microsoft.entra.id
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "ITDR"
picker: >
  Any window works: Huntress reads the whole picker range, newest first, in 4-hour steps. Wide
  ranges take longer (29 days of a small source and 14 days of a very large one each took about
  7 to 9 minutes in testing). Results are complete only once the grid shows Done. Raw results
  load 100 rows at a time as you scroll; scroll until the grid shows Done before treating a
  short or empty result as complete.
placeholders: []
query: >
  from logs
  | WHERE
      event.provider=="ITDR"
  | WHERE
      CONTAINS(itdr.ExtendedProperties.Value, "Cmsi:Cmsi")
  | KEEP
      @timestamp,
      itdr.UserId,
      itdr.UserKey,
      itdr.Operation,
      itdr.ErrorNumber,
      itdr.ApplicationId,
      itdr.ClientIP,
      itdr.DeviceProperties.OS,
      itdr.DeviceProperties.BrowserType,
      itdr.ExtendedProperties.Value
expected_result: >
  A handful of rows on a normal day, if any (8 across all tenants on the test day).
outcomes:
  rows: >
    Each row is a device code sign-in step. Review every one: check the app (itdr.ApplicationId)
    and whether the user expected to sign in on another device.
  empty: >
    No device code sign-ins in this window. This is common; device code flow is rare in most
    businesses.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Some rows can carry an @timestamp outside the picker window; the picker doesn't filter on
  @timestamp alone. Matching relies on the Cmsi:Cmsi request type in
  itdr.ExtendedProperties.Value; no separate device code operation or error was found in
  testing, but that was checked on a single day.
analyst_notes: >
  A device code sign-in carries the request type Cmsi:Cmsi (cross-machine sign-in) inside
  itdr.ExtendedProperties.Value, on UserLoggedIn and UserLoginFailed records. Well-known device
  code clients include 04b07795-8ddb-461a-bbee-02f9e1bf7b46 (Azure CLI). Investigation steps:
  check the client IP against your known user population, since attacker infrastructure commonly
  uses residential proxy ranges. Look for a sign-in from a different IP for the same user
  shortly after the device code event, as that is the attacker using the token. Check for inbox
  rule creation shortly after the sign-in. Containment: disable the account and revoke all
  refresh tokens; a password reset alone does not invalidate existing tokens.
