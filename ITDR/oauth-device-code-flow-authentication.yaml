title: OAuth Device Code Flow Authentication
id: null
status: Production
description: >
  Detects Microsoft 365 / Entra ID authentications using the OAuth 2.0 Device
  Authorization Grant (device code) flow. This flow is legitimate for input-constrained
  devices but is actively abused in device code phishing attacks where victims are tricked
  into entering an attacker-controlled code at microsoft.com/devicelogin. The attacker
  receives a valid refresh token that persists through password resets. In most corporate
  environments device code flow is rarely used legitimately and any occurrence should be
  reviewed.
author: tacticalbeard-dev
date: 2026/05/02
modified: 2026/05/02
references:
  - "https://attack.mitre.org/techniques/T1528/"
  - "https://www.proofpoint.com/us/blog/threat-insight/access-granted-phishing-device-code-authorization-account-takeover"
  - "https://learn.microsoft.com/en-us/entra/identity/conditional-access/policy-block-device-code-flow"
tags:
  - attack.t1528
  - attack.credential_access
  - microsoft.entra.id
logsource:
  language: ESQL
  platform: Huntress SIEM
  type: ITDR
analyst_notes: >
  In the unified audit log a device code sign-in carries the request type Cmsi:Cmsi (cross-machine
  sign-in) inside itdr.ExtendedProperties.Value, on UserLoggedIn and UserLoginFailed records. There is
  no separate device code operation or logon error. Check itdr.ApplicationId: well-known device code
  clients include 04b07795-8ddb-461a-bbee-02f9e1bf7b46 (Azure CLI). Investigation steps when this fires:
  check the client IP against your known user population, since attacker infrastructure commonly uses
  residential proxy ranges. Look for a sign-in from a different IP for the same user shortly after the
  device code event, as that is the attacker using the token. Check for inbox rule creation shortly
  after the sign-in. Containment: disable the account and revoke all refresh tokens; a password reset
  alone does not invalidate existing tokens.
query: >
  from logs
  | WHERE
      event.provider=="ITDR"
  | WHERE
      CONTAINS(itdr.ExtendedProperties.Value, "Cmsi:Cmsi")
  | KEEP
      @timestamp,
      itdr.UserId,
      itdr.UserKey,
      itdr.Operation,
      itdr.ErrorNumber,
      itdr.ApplicationId,
      itdr.ClientIP,
      itdr.DeviceProperties.OS,
      itdr.DeviceProperties.BrowserType
