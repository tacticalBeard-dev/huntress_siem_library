title: Duo Authentication Failure Spike - Single User
id: null
status: Production
description: >
  Detects a high volume of Duo authentication failures (denied or fraud) for a single user and
  application, which may indicate a brute-force or MFA fatigue attempt by someone who already has
  valid credentials.
author: tacticalbeard-dev
date: 2026/05/02
modified: 2026/05/02
references:
  - "https://attack.mitre.org/techniques/T1110/"
  - "https://duo.com/docs/adminapi#authentication-logs"
tags:
  - attack.t1110
  - attack.credential_access
  - cisco.duo
logsource:
  language: ESQL
  platform: Huntress SIEM
  type: Cisco Duo
analyst_notes: >
  Duo records the outcome in duo.result (success, denied, fraud) and the cause in duo.reason
  (for example no_response, user_cancelled, invalid_passcode). A bypass code login is a success
  with duo.reason "bypass_user", not a failure result, so it is not counted here; review those
  separately on every occurrence. For failure spikes, cross-reference the source IP against threat
  intelligence. Failures from multiple locations for the same user (a high unique_ips count) point
  to credential stuffing from many sources rather than a single attacker.
query: >
  from logs
  | WHERE
      event.provider=="Duo"
  | WHERE
      duo.result IN ("denied", "fraud")
  | STATS
      failure_count = COUNT(*),
      unique_ips = COUNT_DISTINCT(duo.access_device.ip)
      BY duo.email, duo.application.name
  | WHERE
      failure_count >= 5
  | SORT
      failure_count DESC
