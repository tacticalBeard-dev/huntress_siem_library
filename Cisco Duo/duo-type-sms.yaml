title: Duo Type SMS
id: fafc9cf2-3122-41d7-b262-381c8c071993
status: Production
description: >
  Find all logs where the event provider is equal to Duo and the result type is SMS.
author: tacticalbeard-dev
date: 2025/06/24
modified: 2026/10/20
references:
  - "https://support.huntress.io/hc/en-us/articles/36516946793107-API-Cisco-Duo"
  - "https://duo.com/docs/adminapi"
tags:
  - attack.t1621
  - attack.t1556.006
  - attack.credential_access
  - cisco.duo
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "Duo"
picker: >
  Any window works; wider windows take longer. Results are complete only once the grid
  shows Done. Raw results load 100 rows at a time as you scroll; scroll until the grid
  shows Done before treating a short or empty result as complete.
placeholders: []
query: >
  from logs
  | WHERE
      event.provider=="Duo"
      AND duo.type=="sms"
  | KEEP
      duo.context,
      event.category,
      duo.type,
      duo.phone
expected_result: >
  A few telephony records on a normal day where users receive SMS passcodes.
outcomes:
  rows: >
    Each row is an SMS sent by Duo. SMS is a weak second factor; users on it are candidates to
    move to push or a hardware token.
  empty: >
    No SMS passcodes were sent in this window.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Some rows can carry an @timestamp outside the picker window; the picker doesn't filter on
  @timestamp alone. These are telephony records, so they carry no user or result; match them to
  authentications by time to see who used SMS. duo.type values are lowercase.
analyst_notes: >
  This will identify when SMS is used to provide authentication which is considered a weak form of secondary authentication.
