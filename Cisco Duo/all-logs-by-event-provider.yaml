title: All Logs by Event Provider
id: 0963e15d-e96f-4963-bfea-959bced2ce03
status: Production
description: >
  Find all logs where the event provider is equal to Duo.
author: tacticalbeard-dev
date: 2025/06/23
modified: 2026/10/20
references:
  - "https://support.huntress.io/hc/en-us/articles/36516946793107-API-Cisco-Duo"
  - "https://duo.com/docs/adminapi"
tags:
  - cisco.duo
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "Duo"
picker: >
  One UTC day: 20:00 to 19:59 Eastern during EDT, 19:00 to 18:59 during EST. A search reads only
  the last UTC day of the picker window, and a future end time returns nothing.
placeholders: []
query: >
  from logs 
  | WHERE
    event.provider=="Duo"
expected_result: >
  Every Duo record for the day: authentication events and telephony (SMS and phone call) events.
outcomes:
  rows: >
    Duo logs are reaching the SIEM. Open a row to see the full set of duo.* fields for building
    other queries.
  empty: >
    No Duo logs arrived for this UTC day. If the tenant uses Duo, check the Duo API integration
    in Huntress before treating anything as clean.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Covers one UTC day per search; run it once per day for a longer period. Telephony records
  carry duo.context, duo.phone and duo.type; authentication records carry the result, factor and
  access device fields.
analyst_notes: >
  This will give you a good starting point for finding the raw logs.
  You can use this information to verify logs are being ingested and retained.
  The raw logs will also assist with creating other queries.
