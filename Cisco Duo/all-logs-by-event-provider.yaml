title: All Logs by Event Provider
id: 0963e15d-e96f-4963-bfea-959bced2ce03
status: Production
description: >
  Find all logs where the event provider is equal to Duo.
author: tacticalbeard-dev
date: 2025/06/23
modified: 2026/10/20
references:
  - "https://support.huntress.io/hc/en-us/articles/36516946793107-API-Cisco-Duo"
  - "https://duo.com/docs/adminapi"
tags:
  - cisco.duo
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "Duo"
picker: >
  Any window works: Huntress reads the whole picker range, newest first, in 4-hour steps. Wide
  ranges take longer (29 days of a small source and 14 days of a very large one each took about
  7 to 9 minutes in testing). Results are complete only once the grid shows Done. Raw results
  load 100 rows at a time as you scroll; scroll until the grid shows Done before treating a
  short or empty result as complete.
placeholders: []
query: >
  from logs 
  | WHERE
    event.provider=="Duo"
expected_result: >
  Every Duo record for the day: authentication events and telephony (SMS and phone call) events.
outcomes:
  rows: >
    Duo logs are reaching the SIEM. Open a row to see the full set of duo.* fields for building
    other queries.
  empty: >
    No Duo logs arrived for this window. If the tenant uses Duo, check the Duo API integration
    in Huntress before treating anything as clean.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Some rows can carry an @timestamp outside the picker window; the picker doesn't filter on
  @timestamp alone. Telephony records carry duo.context, duo.phone and duo.type; authentication
  records carry the result, factor and access device fields.
analyst_notes: >
  This will give you a good starting point for finding the raw logs.
  You can use this information to verify logs are being ingested and retained.
  The raw logs will also assist with creating other queries.
