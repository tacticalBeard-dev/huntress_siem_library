title: Authorization Failure
id: ce313bf5-c9db-4890-b1f4-fb634fba8e68
status: Production
description: >
  Find all logs where the event provider is equal to Duo and the result is denied.
author: tacticalbeard-dev
date: 2025/06/24
modified: 2026/10/20
references:
  - "https://support.huntress.io/hc/en-us/articles/36516946793107-API-Cisco-Duo"
  - "https://duo.com/docs/adminapi"
tags:
  - attack.t1110
  - attack.t1621
  - attack.credential_access
  - cisco.duo
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "Duo"
picker: >
  Any window works: Huntress reads the whole picker range, newest first, in 4-hour steps. Wide
  ranges take longer (29 days of a small source and 14 days of a very large one each took about
  7 to 9 minutes in testing). Results are complete only once the grid shows Done. Raw results
  load 100 rows at a time as you scroll; scroll until the grid shows Done before treating a
  short or empty result as complete.
placeholders: []
query: >
  from logs
  | WHERE
      event.provider=="Duo"
      AND duo.result=="denied"
  | KEEP
      duo.access_device.ip,
      duo.access_device.location.city,
      duo.access_device.location.state,
      duo.access_device.location.country,
      duo.application.name,
      duo.email,
      duo.event_type,
      duo.reason,
      duo.result
expected_result: >
  A few denied authentications on a normal day, mostly no_response or user_cancelled.
outcomes:
  rows: >
    Each row is a denied authentication with its reason, application and access device location.
    Repeated denials for one user, or from an unfamiliar location, are worth following up.
  empty: >
    No denied Duo authentications in this window.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Some rows can carry an @timestamp outside the picker window; the picker doesn't filter on
  @timestamp alone. duo.result values are lowercase (success, denied, fraud); == is case
  sensitive. Location fields are blank on some records.
analyst_notes: >
  This will give you a good idea of location and frequency for denied authorization requests which can indicate unwanted access attempts.  
  It could also indicate legitimate user attempts to access authorized resources which could lead to proactive intervention and less end user friction.
