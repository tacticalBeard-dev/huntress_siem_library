title: GPO Changes
id: 67891669-4de7-40d2-b32d-8c622da8748a
status: Production
description: >
  Find all logs where the event provider is equal to Microsoft-Windows-Security-Auditing and the event code is equal to 5136.
author: tacticalbeard-dev
date: 2025/08/18
modified: 2026/10/20
references:
  - "https://support.huntress.io/hc/en-us/articles/35217204475411-Starter-Queries-Windows-Security"
  - "https://support.huntress.io/hc/en-us/articles/36005287194259-Collecting-Microsoft-Windows-Event-Logs"
tags:
  - attack.t1484.001
  - attack.defense_evasion
  - attack.privilege_escalation
  - windows.event
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "Microsoft-Windows-Security-Auditing"
picker: >
  One UTC day: 20:00 to 19:59 Eastern during EDT, 19:00 to 18:59 during EST. A search reads only
  the last UTC day of the picker window, and a future end time returns nothing.
placeholders: []
query: >
  from logs
  | WHERE 
      event.provider=="Microsoft-Windows-Security-Auditing" 
  | WHERE 
      event.code==5136 
  | KEEP 
      host.hostname, 
      user.name, 
      event.code, 
      message, 
      winlog.event_data.ObjectDN, 
      winlog.event_data.OperationType 
expected_result: >
  Directory object changes (5136) on domain controllers; about 148,000 across all tested tenants
  on the test day.
outcomes:
  rows: >
    Each row is a directory object modification. Filter winlog.event_data.ObjectDN for
    CN=Policies to focus on Group Policy objects.
  empty: >
    No directory changes on this UTC day. 5136 needs Audit Directory Service Changes on the
    domain controllers and a SACL on the objects.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Covers one UTC day per search; run it once per day for a longer period. winlog.event_data.*
  values are strings and field names are case sensitive.
analyst_notes: >
  Event ID 5136 - A directory service object was modified.
