title: DNS Client Event Provider
id: d9ba45a8-a9a4-4055-a34e-0f49a7bfcb73
status: Production
description: >
  Find all logs where the event provider is equal to Microsoft-Windows-DNS-Client.
author: tacticalbeard-dev
date: 2025/07/14
modified: 2026/10/20
references:
  - "https://support.huntress.io/hc/en-us/articles/35217204475411-Starter-Queries-Windows-Security"
  - "https://support.huntress.io/hc/en-us/articles/36005287194259-Collecting-Microsoft-Windows-Event-Logs"
tags:
  - windows.event
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "Microsoft-Windows-DNS-Client"
picker: >
  One UTC day: 20:00 to 19:59 Eastern during EDT, 19:00 to 18:59 during EST. A search reads only
  the last UTC day of the picker window, and a future end time returns nothing.
placeholders: []
query: >
  from logs
  | WHERE
      event.provider=="Microsoft-Windows-DNS-Client"
  | KEEP
      event.code,
      host.hostname,
      winlog.event_data.Address,
      winlog.event_data.AddressLength,
      winlog.event_data.QueryName,
      winlog.event_data.DnsServerList,
      winlog.event_data.Ipaddress,
      winlog.event_data.ErrorCode
expected_result: >
  DNS client warnings from endpoints, mostly failed DNS registration (8015, 8017), with
  occasional name resolution timeouts (1014).
outcomes:
  rows: >
    Each row is a DNS client event. Repeated 1014 timeouts on many hosts point to a DNS server
    problem rather than a single machine.
  empty: >
    No DNS client events on this UTC day, or the DNS-Client log isn't being collected.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Covers one UTC day per search; run it once per day for a longer period. winlog.event_data.*
  values are strings and field names are case sensitive. DNS-Client uses Ipaddress (lowercase
  a), not IpAddress.
analyst_notes: |
  These logs include client side operations and resolution activities for DNS.
  Event ID 1014 - Name resolution for the name [hostname] timed out after none of the configured DNS servers responded.
  Event ID 8015 - The system failed to register host (A or AAAA) resource records (RRs) for a network adapter.
  Event ID 8017 - The system failed to update and remove host (A or AAAA) resource records (RRs) for network adapter.
