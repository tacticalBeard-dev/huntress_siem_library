title: Sonicwall VPN IOC driver installed by attacker
id: 8e811ff2-5313-4155-bee3-989a6f3fbc3d
status: Production
description: >
  Find all logs where the event provider is equal to Microsoft-Windows-Security-Auditing and driver service reported by Huntress blog.
author: tacticalbeard-dev
date: 2025/08/18
modified: 2026/10/20
references:
  - "https://support.huntress.io/hc/en-us/articles/30113222043155-Huntress-Managed-SIEM-Log-Search-Guide"
  - "https://support.huntress.io/hc/en-us/articles/36005287194259-Collecting-Microsoft-Windows-Event-Logs"
  - "https://www.huntress.com/blog/exploitation-of-sonicwall-vpn"
  - "https://www.bleepingcomputer.com/news/security/akira-ransomware-abuses-cpu-tuning-tool-to-disable-microsoft-defender/"
tags:
  - attack.t1543.003
  - attack.t1562.001
  - attack.persistence
  - attack.defense_evasion
  - windows.event
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "Microsoft-Windows-Security-Auditing"
picker: >
  One UTC day: 20:00 to 19:59 Eastern during EDT, 19:00 to 18:59 during EST. A search reads only
  the last UTC day of the picker window, and a future end time returns nothing.
placeholders: []
query: >
  from logs 
  | WHERE 
      event.provider=="Microsoft-Windows-Security-Auditing" 
  | WHERE 
      event.code==4697 
  | WHERE 
      winlog.event_data.ServiceName=="rwdrv.sys"
      or
      winlog.event_data.ServiceName=="hlpdrv.sys"
expected_result: >
  Nothing, unless a host installed one of the published attacker drivers.
outcomes:
  rows: >
    A host installed rwdrv.sys or hlpdrv.sys as a service. Treat it as an incident.
  empty: >
    Neither driver was installed as a service on this UTC day. Empty is not clean unless Audit
    Security System Extension is enabled (4697 isn't logged without it). Run it for every day of
    the period you care about.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Covers one UTC day per search; run it once per day for a longer period. winlog.event_data.*
  values are strings and field names are case sensitive (DNS-Client uses Ipaddress, lowercase
  a).
analyst_notes: >
  Driver services created by attacker posted on Huntress blog as IOCs.
  The abused driver is 'rwdrv.sys' (used by ThrottleStop), which the threat actors register as a service to gain kernel-level access.
  This driver is likely used to load a second driver, 'hlpdrv.sys,' a malicious tool that manipulates Windows Defender to turn off its protections.
