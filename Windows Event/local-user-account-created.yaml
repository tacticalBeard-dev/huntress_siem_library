title: New User Account Created
id: 2db0e395-5954-409d-827f-50c2e1d647be
status: Production
description: >
  Detects creation of a new local user account via Event 4720. While domain accounts are
  the norm in managed environments, attackers frequently create local accounts as a
  persistence mechanism to maintain access even if domain credentials are reset. A new
  local account created by a non-IT process or outside of a known provisioning window -
  especially followed by Event 4732 (addition to local Administrators group) - is a
  significant indicator of compromise.
author: tacticalbeard-dev
date: 2026/05/02
modified: 2026/10/20
references:
  - "https://attack.mitre.org/techniques/T1136/001/"
  - "https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4720"
tags:
  - attack.t1136.001
  - attack.persistence
  - windows.event
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "Microsoft-Windows-Security-Auditing"
picker: >
  Any window works: Huntress reads the whole picker range, newest first, in 4-hour steps. Wide
  ranges take longer (29 days of a small source and 14 days of a very large one each took about
  7 to 9 minutes in testing). Results are complete only once the grid shows Done. Raw results
  load 100 rows at a time as you scroll; scroll until the grid shows Done before treating a
  short or empty result as complete.
placeholders: []
query: >
  from logs
  | WHERE
      event.provider=="Microsoft-Windows-Security-Auditing"
      AND event.code==4720
  | KEEP
      host.hostname,
      winlog.event_data.SubjectUserName,
      winlog.event_data.SubjectDomainName,
      winlog.event_data.TargetUserName,
      winlog.event_data.SamAccountName,
      winlog.event_data.DisplayName
expected_result: >
  A few hundred account creations a day across a set of domains and endpoints.
outcomes:
  rows: >
    Each row is a new account (4720). Local accounts created on workstations or servers,
    especially by SYSTEM, are worth checking.
  empty: >
    No accounts were created in this window. Empty is not clean unless Audit User Account
    Management is enabled on the hosts and domain controllers.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Some rows can carry an @timestamp outside the picker window; the picker doesn't filter on
  @timestamp alone. winlog.event_data.* values are strings and field names are case sensitive.
analyst_notes: >
  Pair with Event 4732 (added to local Administrators group) to detect the full attacker
  workflow - create account then elevate it. SubjectUserName is the account that performed
  the action. SYSTEM-initiated account creation by a non-administrative process is especially
  suspicious. Filter known deployment or imaging tools that create accounts as part of build
  processes to reduce noise. Event 4720 covers local accounts on any host and domain
  accounts on domain controllers. account-management-events.yaml also captures 4720 alongside
  other account lifecycle events.
