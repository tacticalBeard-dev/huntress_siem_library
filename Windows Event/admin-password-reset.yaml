title: Password Reset by Another Account
id: 2dab2aa6-bf71-4ff4-8ca0-99bace440b00
status: Production
description: >
  List Active Directory and local account passwords reset by another account (4724). Attackers
  reset passwords to take over accounts or lock out admins.
author: tacticalbeard-dev
date: 2026/10/21
modified: 2026/10/21
references:
  - "https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4724"
  - "https://attack.mitre.org/techniques/T1098/"
  - "https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/appendix-l--events-to-monitor"
tags:
  - attack.t1098
  - attack.persistence
  - windows.event
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "Microsoft-Windows-Security-Auditing"
picker: >
  Any window works; wider windows take longer. Results are complete only once the grid
  shows Done.
placeholders: []
query: >
  from logs
  | WHERE
      event.provider=="Microsoft-Windows-Security-Auditing"
      AND event.code==4724
  | STATS
      resets = COUNT(*),
      first_seen = MIN(@timestamp),
      last_seen = MAX(@timestamp)
      BY winlog.event_data.SubjectUserName, winlog.event_data.TargetUserName, host.hostname
  | SORT
      resets DESC
expected_result: >
  Rows most days, mostly helpdesk and service accounts.
outcomes:
  rows: >
    winlog.event_data.SubjectUserName made the reset and winlog.event_data.TargetUserName is the
    account reset. Watch for one account resetting many others in a short time, resets of admin
    accounts, and resets made by an account that isn't on the helpdesk.
  empty: >
    No resets in this window. 4724 needs Audit User Account Management on.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Some rows can carry an @timestamp outside the picker window; the picker doesn't filter on
  @timestamp alone. The grid shows at most 1,000 rows. Self-service password changes log as
  4723, not 4724. Computer accounts (names ending in $) reset by the system are normal.
analyst_notes: >
  A reset followed by a logon of the reset account from a new IP is the account takeover
  pattern.
