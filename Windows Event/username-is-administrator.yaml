title: Username is Administrator
id: 78e2a4d4-af15-4620-878e-85cc9b3b68b4
status: Production
description: >
  Find all logs where the event provider is equal to Microsoft-Windows-Security-Auditing and the username is equal to administrator.
author: tacticalbeard-dev
date: 2025/07/14
modified: 2026/10/20
references:
  - "https://support.huntress.io/hc/en-us/articles/35217204475411-Starter-Queries-Windows-Security"
  - "https://support.huntress.io/hc/en-us/articles/36005287194259-Collecting-Microsoft-Windows-Event-Logs"
tags:
  - attack.t1078.003
  - attack.initial_access
  - attack.defense_evasion
  - windows.event
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "Microsoft-Windows-Security-Auditing"
picker: >
  Any window works: Huntress reads the whole picker range, newest first, in 4-hour steps. Wide
  ranges take longer (29 days of a small source and 14 days of a very large one each took about
  7 to 9 minutes in testing). Results are complete only once the grid shows Done. Raw results
  load 100 rows at a time as you scroll; scroll until the grid shows Done before treating a
  short or empty result as complete.
placeholders: []
query: >
  from logs
  | WHERE
      event.provider=="Microsoft-Windows-Security-Auditing"
  | WHERE
      TO_LOWER(user.name) == "administrator"
  | KEEP
      event.code,
      message,
      host.hostname,
      source.host.name,
      user.name,
      winlog.channel
expected_result: >
  Thousands of events a day for built-in administrator accounts across a set of hosts.
outcomes:
  rows: >
    Each row is an event naming an administrator account, in any casing. Add an event.code
    filter to narrow it.
  empty: >
    No events name an administrator account in this window, which would be unusual.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Some rows can carry an @timestamp outside the picker window; the picker doesn't filter on
  @timestamp alone. winlog.event_data.* values are strings and field names are case sensitive.
analyst_notes: >
  Every Security-Auditing event for an account named administrator, in any casing (Administrator,
  ADMINISTRATOR). Add an event.code filter to narrow it, for example 4625 for failed logons or 4624
  for successful ones.
