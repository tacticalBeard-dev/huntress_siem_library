title: HttpService Event Provider
id: 5abecfbc-c393-4933-b890-a8da88512c1d
status: Production
description: >
  Find all logs where the event provider is equal to Microsoft-Windows-HttpService.
author: tacticalbeard-dev
date: 2025/07/14
modified: 2026/10/20
references:
  - "https://support.huntress.io/hc/en-us/articles/35217204475411-Starter-Queries-Windows-Security"
  - "https://support.huntress.io/hc/en-us/articles/36005287194259-Collecting-Microsoft-Windows-Event-Logs"
tags:
  - windows.event
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "Microsoft-Windows-HttpService"
picker: >
  One UTC day: 20:00 to 19:59 Eastern during EDT, 19:00 to 18:59 during EST. A search reads only
  the last UTC day of the picker window, and a future end time returns nothing.
placeholders: []
query: >
  from logs
  | WHERE
      event.provider=="Microsoft-Windows-HttpService"
  | KEEP
      event.code,
      host.hostname,
      winlog.event_data.ProcessId,
      winlog.event_data.Url,
      winlog.event_data.UserSid
expected_result: >
  HTTP.sys configuration events (URL groups and request queues) from hosts running web services.
outcomes:
  rows: >
    Each row is an HTTP.sys configuration change with the process and URL. New URL registrations
    by unexpected processes are worth a look.
  empty: >
    No HTTP.sys events on this UTC day, or this log isn't being collected.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Covers one UTC day per search; run it once per day for a longer period. winlog.event_data.*
  values are strings and field names are case sensitive (DNS-Client uses Ipaddress, lowercase
  a).
analyst_notes: >
  These logs primarily concerned with the HTTP.sys kernel-mode driver. 
  This driver is a core component of Windows that handles HTTP requests and responses at a very low level.
  Event ID 111 - HTTP Configuration Property Trace Task - Add URL Group.
  Event ID 112 - HTTP Configuration Property Trace Task - Add Request Queue.
  Event ID 113 - HTTP Configuration Property Trace Task - Set Property.
  Event ID 114 - HTTP Configuration Property Trace Task - Delete URL Group.
  Event ID 117 - HTTP Configuration Property Trace Task - Delete URL group.
