title: Event Provider by Hostname
id: 0c33dbc4-428c-4ae0-b459-9b62a65a861f
status: Production
description: >
  Find all logs where the event provider is equal to Microsoft-Windows-Security-Auditing and the hostname matches provided string.
author: tacticalbeard-dev
date: 2025/07/14
modified: 2026/10/20
references:
  - "https://support.huntress.io/hc/en-us/articles/35217204475411-Starter-Queries-Windows-Security"
  - "https://support.huntress.io/hc/en-us/articles/36005287194259-Collecting-Microsoft-Windows-Event-Logs"
tags:
  - windows.event
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "Microsoft-Windows-Security-Auditing"
picker: >
  Any window works; wider windows take longer. Results are complete only once the grid
  shows Done. Raw results load 100 rows at a time as you scroll; scroll until the grid
  shows Done before treating a short or empty result as complete.
placeholders:
  - "<hostname fqdn>: the host's fully qualified name exactly as logged, for example pc01.corp.example.com"
query: >
  from logs
  | WHERE
      event.provider=="Microsoft-Windows-Security-Auditing"
  | WHERE
      host.hostname == "<hostname fqdn>"
expected_result: >
  Every Security-Auditing event from that one host for the day.
outcomes:
  rows: >
    The host is sending Security logs. Use it to review one machine's activity or to check that
    a newly onboarded host is reporting.
  empty: >
    No Security events from that name in this window. The match is exact and case sensitive, so
    copy the hostname from an existing row.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Some rows can carry an @timestamp outside the picker window; the picker doesn't filter on
  @timestamp alone. winlog.event_data.* values are strings and field names are case sensitive.
analyst_notes: >
  The hostname requires the FQDN for an exact match.
