title: Account Management Events
id: c9b4ed04-c113-4943-9d35-600f6c6f0dc0
status: Production
description: >
  Find all logs where the event provider is equal to Microsoft-Windows-Security-Auditing and the event code is equal to 4720, 4722, 4725, 4726, 4741, or 4743.
author: tacticalbeard-dev
date: 2025/07/14
modified: 2026/10/20
references:
  - "https://support.huntress.io/hc/en-us/articles/35217204475411-Starter-Queries-Windows-Security"
  - "https://support.huntress.io/hc/en-us/articles/36005287194259-Collecting-Microsoft-Windows-Event-Logs"
tags:
  - attack.t1098
  - attack.t1136
  - attack.t1531
  - attack.persistence
  - attack.impact
  - windows.event
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "Microsoft-Windows-Security-Auditing"
picker: >
  One UTC day: 20:00 to 19:59 Eastern during EDT, 19:00 to 18:59 during EST. A search reads only
  the last UTC day of the picker window, and a future end time returns nothing.
placeholders: []
query: >
  from logs
  | WHERE 
      event.provider=="Microsoft-Windows-Security-Auditing" 
  | WHERE 
      event.code IN (4720, 4722, 4725, 4726, 4741, 4743)
  | KEEP 
      host.hostname, 
      event.code, 
      winlog.event_data.SubjectDomainName, 
      winlog.event_data.SubjectUserName, 
      winlog.event_data.SubjectLogonId, 
      winlog.event_data.TargetDomainName, 
      winlog.event_data.TargetUserName, 
      winlog.event_data.DisplayName
expected_result: >
  A few hundred account lifecycle events a day across a set of domains.
outcomes:
  rows: >
    Each row is a user or computer account created (4720, 4741), enabled (4722), disabled (4725)
    or deleted (4726, 4743), with who did it (Subject) and to which account (Target).
  empty: >
    No account changes on this UTC day. These events need Audit User Account Management and
    Audit Computer Account Management enabled.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Covers one UTC day per search; run it once per day for a longer period. winlog.event_data.*
  values are strings and field names are case sensitive.
analyst_notes: |
  These logs are all related to User and Group Account Management.
  Event ID 4720 - A user account was created.
  Event ID 4722 - A user account was enabled.
  Event ID 4725 - A user account was disabled.
  Event ID 4726 - A user account was deleted.
  Event ID 4741 - A computer account was created.
  Event ID 4743 - A computer account was deleted.
