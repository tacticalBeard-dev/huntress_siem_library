title: Sonicwall VPN IOC user created by attacker
id: 81e49585-cc78-439c-a953-39d01745f0ef
status: Production
description: >
  Find all logs where the event provider is equal to Microsoft-Windows-Security-Auditing and user name IOC reported by Huntress blog.
author: tacticalbeard-dev
date: 2025/08/18
modified: 2026/10/20
references:
  - "https://support.huntress.io/hc/en-us/articles/30113222043155-Huntress-Managed-SIEM-Log-Search-Guide"
  - "https://support.huntress.io/hc/en-us/articles/36005287194259-Collecting-Microsoft-Windows-Event-Logs"
  - "https://www.huntress.com/blog/exploitation-of-sonicwall-vpn"
tags:
  - attack.t1136.001
  - attack.persistence
  - windows.event
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "Microsoft-Windows-Security-Auditing"
picker: >
  Any window works: Huntress reads the whole picker range, newest first, in 4-hour steps. Wide
  ranges take longer (29 days of a small source and 14 days of a very large one each took about
  7 to 9 minutes in testing). Results are complete only once the grid shows Done. Raw results
  load 100 rows at a time as you scroll; scroll until the grid shows Done before treating a
  short or empty result as complete.
placeholders: []
query: >
  from logs
  | WHERE 
      event.provider=="Microsoft-Windows-Security-Auditing" 
  | WHERE 
      winlog.event_data.TargetUserName =="backupSQL"
      or
      winlog.event_data.TargetUserName =="lockadmin"
expected_result: >
  Nothing, unless one of the published attacker account names exists.
outcomes:
  rows: >
    One of the attacker account names appears. Treat it as an incident.
  empty: >
    Neither account name appears in this window. Names are matched exactly and case sensitively.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Some rows can carry an @timestamp outside the picker window; the picker doesn't filter on
  @timestamp alone. winlog.event_data.* values are strings and field names are case sensitive.
analyst_notes: >
  User accounts created by attacker posted on Huntress blog as IOCs.
