title: All Logs by Event Provider
id: fc927cb2-fd7e-45b4-a231-2292dcbf0273
status: Production
description: >
  Find all logs where the event provider is equal to Syslog-SentinelOne.
author: tacticalbeard-dev
date: 2025/09/28
modified: 2026/10/20
references:
  - "https://support.huntress.io/hc/en-us/articles/41838176250259-API-SentinelOne-Audit-Logs"
tags:
  - sentinelone
logsource:
  language: ESQL
  platform: Huntress SIEM
  provider: "Syslog-SentinelOne"
picker: >
  Any window works; wider windows take longer. Results are complete only once the grid
  shows Done. Raw results load 100 rows at a time as you scroll; scroll until the grid
  shows Done before treating a short or empty result as complete.
placeholders: []
query: >
  from logs 
  | WHERE
    event.provider=="Syslog-SentinelOne"
expected_result: >
  A handful of records a day: threat detections, mitigation actions (kill, quarantine), and
  analyst status and verdict changes.
outcomes:
  rows: >
    SentinelOne alerts are reaching the SIEM. event.code identifies the activity, for example 19
    new active threat, 2001 kill, 2004 quarantine, 2009 quarantine failed.
  empty: >
    No SentinelOne records in this window. The integration only sends alerts and threat
    activity, not endpoint telemetry, so quiet days happen; check the integration if it stays
    empty for several days.
  error: >
    Check the query was pasted whole and every placeholder was replaced. Huntress reports parser
    errors as Not all query parsed or Invalid operator.
known_limits: >
  Some rows can carry an @timestamp outside the picker window; the picker doesn't filter on
  @timestamp alone. Only alert and threat activity is ingested, so this can't be used to hunt
  raw endpoint events.
analyst_notes: >
  This will give you a good starting point for finding the raw logs.
  You can use this information to verify logs are being ingested and retained.
  The raw logs will also assist with creating other queries.
